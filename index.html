<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موسوعة الفضاء - EXPLORE SPACE</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050812;--card:#10152B;--card2:#151B35;--accent:#7C5CFF;--blue:#3DD6FF;--text:#A8AFC4}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:'Tajawal',sans-serif}
nav{position:fixed;top:0;width:100%;padding:16px 6%;display:flex;justify-content:space-between;align-items:center;background:rgba(5,8,18,0.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);z-index:100}
.logo{font-weight:900;letter-spacing:1px}
.hero{margin-top:60px;padding:60px 6% 40px;display:grid;grid-template-columns:1.1fr 0.9fr;gap:40px;align-items:center;min-height:85vh}
.hero h1{font-size:72px;font-weight:900;line-height:0.9}
.hero h1 span{background:linear-gradient(90deg,#fff,#3DD6FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
</style>
</head>
<body>
<nav>
<div class="logo">🌌 EXPLORE SPACE</div>
</nav>
<section class="hero">
<div>
<h1>موسوعة <span>الفضاء</span></h1>
<p style="margin-top:20px; color:var(--text); font-size:18px;">بوابتكِ لاستكشاف أسرار الكون والمجرات والثقوب السوداء.</p>
</div>
</section>
</body>
</html>
